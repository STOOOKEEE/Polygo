name: Polygo
options:
  bundleIdPrefix: com.syllune
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: fr
packages:
  PolygoPackage:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
targets:
  PolygoApple:
    type: framework
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Apple
    dependencies:
      - package: PolygoPackage
        product: PolygoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syllune.PolygoApple
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Syllune utilise le microphone uniquement pour comparer ta phrase localement."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Syllune utilise la reconnaissance vocale sur l’appareil pour transcrire ta phrase."
  PolygoApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    resources:
      - path: Content
      - path: Design
    dependencies:
      - target: PolygoApple_iOS
      - package: PolygoPackage
        product: PolygoCore
      - package: PolygoPackage
        product: PolygoSRS
      - package: PolygoPackage
        product: PolygoPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syllune.Polygo
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Syllune utilise le microphone uniquement pour comparer ta phrase localement."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Syllune utilise la reconnaissance vocale sur l’appareil pour transcrire ta phrase."
  PolygoMacApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
    resources:
      - path: Content
      - path: Design
    dependencies:
      - target: PolygoApple_macOS
      - package: PolygoPackage
        product: PolygoCore
      - package: PolygoPackage
        product: PolygoSRS
      - package: PolygoPackage
        product: PolygoPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syllune.PolygoMac
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Syllune utilise le microphone uniquement pour comparer ta phrase localement."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Syllune utilise la reconnaissance vocale sur l’appareil pour transcrire ta phrase."
  PolygoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PolygoAppUITests
    dependencies:
      - target: PolygoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syllune.PolygoAppUITests
        TEST_TARGET_NAME: PolygoApp

schemes:
  PolygoApp:
    build:
      targets:
        PolygoApp: all
        PolygoAppUITests: test
    test:
      config: Debug
      targets:
        - name: PolygoAppUITests
