name: Apple builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run portable package tests
        run: swift test --parallel

  build-ios:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iOS app
        run: >-
          xcodebuild
          -project Polygo.xcodeproj
          -scheme PolygoApp
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/PolygoDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Verify built iOS app metadata
        run: |
          set -euo pipefail
          products_dir="$RUNNER_TEMP/PolygoDerivedData/Build/Products"
          app_plist="$(find "$products_dir" -type f -path '*/PolygoApp.app/Info.plist' -print -quit)"
          if [ -z "$app_plist" ]; then
            echo "::error::PolygoApp.app/Info.plist is missing from the iOS build products"
            find "$products_dir" -type f -name Info.plist -print
            exit 1
          fi

          echo "Inspecting compiled iOS metadata: $app_plist"
          plutil -p "$app_plist"

          launch_screen="$(plutil -extract UILaunchScreen xml1 -o - "$app_plist" 2>/dev/null || true)"
          launch_storyboard="$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$app_plist" 2>/dev/null || true)"
          if [ -n "$launch_screen" ]; then
            echo "Modern UILaunchScreen declaration found"
          elif [ -n "$launch_storyboard" ]; then
            echo "Legacy UILaunchStoryboardName declaration found: $launch_storyboard"
          else
            echo "::error::The compiled iOS app has neither UILaunchScreen nor UILaunchStoryboardName"
            exit 1
          fi

          device_family="$(plutil -extract UIDeviceFamily json -o - "$app_plist" 2>/dev/null || true)"
          if ! printf '%s\n' "$device_family" | grep -Eq '(^|[^0-9])1([^0-9]|$)' \
            || ! printf '%s\n' "$device_family" | grep -Eq '(^|[^0-9])2([^0-9]|$)'; then
            echo "::error::The compiled iOS app must target iPhone and iPad (UIDeviceFamily=$device_family)"
            exit 1
          fi
          echo "UIDeviceFamily includes iPhone and iPad: $device_family"

      - name: Run iOS UI smoke tests
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$simulator_id"
          xcodebuild \
            -project Polygo.xcodeproj \
            -scheme PolygoApp \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -destination-timeout 120 \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/PolygoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath "$RUNNER_TEMP/PolygoAppUITests.xcresult" \
            test

      - name: Upload iOS UI test result bundle
        # Keep successful UI attachments too: the journey adds named
        # screenshots for visual review, and a green run is the useful case.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PolygoAppUITests-${{ github.run_id }}
          path: ${{ runner.temp }}/PolygoAppUITests.xcresult
          if-no-files-found: warn

  build-macos:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build macOS app
        run: >-
          xcodebuild
          -project Polygo.xcodeproj
          -scheme PolygoMacApp
          -destination 'platform=macOS'
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/PolygoMacDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Run macOS UI smoke tests
        run: |
          set -euo pipefail
          # Keep this journey deterministic on a fresh runner and ensure the
          # screenshot starts from the real onboarding flow.
          rm -rf "$HOME/Library/Application Support/Polygo"
          rm -rf "$HOME/Library/Saved Application State/com.syllune.PolygoMac.savedState"
          defaults delete com.syllune.PolygoMac >/dev/null 2>&1 || true
          xcodebuild \
            -project Polygo.xcodeproj \
            -scheme PolygoMacApp \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/PolygoMacDerivedData" \
            -destination-timeout 120 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath "$RUNNER_TEMP/PolygoMacUITests.xcresult" \
            test

      - name: Export macOS UI screenshots
        if: ${{ always() }}
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/PolygoMacUITests.xcresult"
          export_dir="$RUNNER_TEMP/PolygoMacScreenshots"
          mkdir -p "$export_dir"
          if [ -d "$result_bundle" ]; then
            if ! xcrun xcresulttool export attachments \
              --path "$result_bundle" \
              --output-path "$export_dir"; then
              echo "::warning::xcresulttool n’a pas exporté les pièces jointes; le bundle reste disponible"
            fi
          fi

      - name: Upload macOS UI test result and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PolygoMacUITests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/PolygoMacUITests.xcresult
            ${{ runner.temp }}/PolygoMacScreenshots
          if-no-files-found: warn
