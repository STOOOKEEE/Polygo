name: Apple builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run portable package tests
        run: swift test --parallel

  build-ios:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iOS app
        run: >-
          xcodebuild
          -project Polygo.xcodeproj
          -scheme PolygoApp
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/PolygoDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Verify built iOS app metadata
        run: |
          set -euo pipefail
          products_dir="$RUNNER_TEMP/PolygoDerivedData/Build/Products"
          app_plist="$(find "$products_dir" -type f -path '*/PolygoApp.app/Info.plist' -print -quit)"
          if [ -z "$app_plist" ]; then
            echo "::error::PolygoApp.app/Info.plist is missing from the iOS build products"
            find "$products_dir" -type f -name Info.plist -print
            exit 1
          fi

          echo "Inspecting compiled iOS metadata: $app_plist"
          plutil -p "$app_plist"

          launch_screen="$(plutil -extract UILaunchScreen xml1 -o - "$app_plist" 2>/dev/null || true)"
          launch_storyboard="$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$app_plist" 2>/dev/null || true)"
          if [ -n "$launch_screen" ]; then
            echo "Modern UILaunchScreen declaration found"
          elif [ -n "$launch_storyboard" ]; then
            echo "Legacy UILaunchStoryboardName declaration found: $launch_storyboard"
          else
            echo "::error::The compiled iOS app has neither UILaunchScreen nor UILaunchStoryboardName"
            exit 1
          fi

          device_family="$(plutil -extract UIDeviceFamily json -o - "$app_plist" 2>/dev/null || true)"
          if ! printf '%s\n' "$device_family" | grep -Eq '(^|[^0-9])1([^0-9]|$)' \
            || ! printf '%s\n' "$device_family" | grep -Eq '(^|[^0-9])2([^0-9]|$)'; then
            echo "::error::The compiled iOS app must target iPhone and iPad (UIDeviceFamily=$device_family)"
            exit 1
          fi
          echo "UIDeviceFamily includes iPhone and iPad: $device_family"

      - name: Run iOS UI smoke tests
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$simulator_id"
          xcodebuild \
            -project Polygo.xcodeproj \
            -scheme PolygoApp \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -destination-timeout 120 \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/PolygoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath "$RUNNER_TEMP/PolygoAppUITests.xcresult" \
            test

      - name: Run iPad large-text UI smoke tests
        run: |
          set -euo pipefail

          simctl_ui_help="$(xcrun simctl help ui 2>&1 || true)"
          if ! printf '%s\n' "$simctl_ui_help" | grep -Fq 'content_size'; then
            echo "::error::This runner does not document simctl ui content_size; the ipad-ax5 large-text smoke cannot be run"
            printf '%s\n' "$simctl_ui_help"
            exit 1
          fi

          ipad_simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '
            /iPad/ {
              for (field = 2; field <= NF; field += 2) {
                if (length($field) == 36 && index($field, "-") > 0) {
                  print $field
                  exit
                }
              }
            }
          ')"
          if [ -z "$ipad_simulator_id" ]; then
            echo "::error::No available iPad Simulator found for the ipad-ax5 large-text smoke"
            exit 1
          fi

          ipad_device_line="$(xcrun simctl list devices available | awk -v device_id="($ipad_simulator_id)" 'index($0, device_id) { print; exit }')"
          if [ -z "$ipad_device_line" ]; then
            echo "::error::The discovered iPad Simulator is no longer available: $ipad_simulator_id"
            exit 1
          fi
          case "$ipad_device_line" in
            *"(Booted)"*) ;;
            *) xcrun simctl boot "$ipad_simulator_id" ;;
          esac
          xcrun simctl bootstatus "$ipad_simulator_id" -b

          xcrun simctl ui "$ipad_simulator_id" content_size accessibility-extra-extra-extra-large
          content_size="$(xcrun simctl ui "$ipad_simulator_id" content_size)"
          printf 'iPad %s content_size: %s\n' "$ipad_simulator_id" "$content_size"
          case "$content_size" in
            *accessibility-extra-extra-extra-large*) ;;
            *)
              echo "::error::The iPad Simulator did not retain accessibility-extra-extra-extra-large content size"
              exit 1
              ;;
          esac

          xcodebuild \
            -project Polygo.xcodeproj \
            -scheme PolygoApp \
            -destination "platform=iOS Simulator,id=$ipad_simulator_id" \
            -destination-timeout 120 \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/PolygoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath "$RUNNER_TEMP/PolygoAppUITests-ipad-ax5.xcresult" \
            -only-testing:PolygoAppUITests/PolygoAppUITests \
            -only-testing:PolygoAppUITests/LessonReviewJourneyTests/testGuidedWritingRejectsWrongStrokeThenAcceptsRetry \
            -only-testing:PolygoAppUITests/LessonReviewJourneyTests/testFreeWritingFailureCanBeSelfReportedAndAdvance \
            -only-testing:PolygoAppUITests/ZZLessonRegressionJourneyTests/testLessonDraftFeedbackDialogueAndOralJourney \
            test

      - name: Export iOS UI screenshots
        if: ${{ always() }}
        run: |
          set -euo pipefail
          iphone_result_bundle="$RUNNER_TEMP/PolygoAppUITests.xcresult"
          iphone_export_dir="$RUNNER_TEMP/PolygoAppScreenshots"
          ipad_result_bundle="$RUNNER_TEMP/PolygoAppUITests-ipad-ax5.xcresult"
          ipad_export_dir="$iphone_export_dir/ipad-ax5"
          mkdir -p "$iphone_export_dir" "$ipad_export_dir"

          if [ -d "$iphone_result_bundle" ]; then
            if ! xcrun xcresulttool export attachments \
              --path "$iphone_result_bundle" \
              --output-path "$iphone_export_dir"; then
              echo "::warning::xcresulttool n’a pas exporté les pièces jointes iPhone; le bundle reste disponible"
            fi
          fi

          if [ -d "$ipad_result_bundle" ]; then
            if ! xcrun xcresulttool export attachments \
              --path "$ipad_result_bundle" \
              --output-path "$ipad_export_dir"; then
              echo "::warning::xcresulttool n’a pas exporté les pièces jointes iPad; le bundle reste disponible"
            fi
          fi

      - name: Upload iOS UI test results and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PolygoAppUITests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/PolygoAppUITests.xcresult
            ${{ runner.temp }}/PolygoAppUITests-ipad-ax5.xcresult
            ${{ runner.temp }}/PolygoAppScreenshots
          if-no-files-found: warn

  build-macos:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Prepare macOS UI test display
        run: |
          set -euo pipefail
          if ! command -v displayplacer >/dev/null 2>&1; then
            brew install displayplacer
          fi

          display_info="$(displayplacer list)"
          screen_id="$(printf '%s\n' "$display_info" | awk -F ': ' '/Persistent screen id:/ { print $2; exit }')"
          test -n "$screen_id"

          # The desktop home needs 944 points of content, 56 points of
          # padding, and the 240 point sidebar. Pick a supported mode that
          # leaves room for that composition on the hosted runner.
          mode="$(printf '%s\n' "$display_info" \
            | sed -nE 's/.*mode [0-9]+: (res:[0-9]+x[0-9]+ hz:[0-9]+ color_depth:[0-9]+).*/\1 scaling:off/p' \
            | awk '
              {
                split($1, resolution, ":"); split(resolution[2], dimensions, "x")
                if (dimensions[1] >= 1440 && dimensions[2] >= 900) { print; exit }
              }
            ')"
          if [ -z "$mode" ]; then
            echo "::error::No supported macOS display mode is at least 1440x900"
            printf '%s\n' "$display_info"
            exit 1
          fi

          displayplacer "id:${screen_id} ${mode} origin:(0,0) degree:0"
          displayplacer list

      - name: Build macOS app
        run: >-
          xcodebuild
          -project Polygo.xcodeproj
          -scheme PolygoMacApp
          -destination 'platform=macOS'
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/PolygoMacDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Run macOS UI smoke tests
        run: |
          set -euo pipefail
          # Keep this journey deterministic on a fresh runner and ensure the
          # screenshot starts from the real onboarding flow.
          rm -rf "$HOME/Library/Application Support/Polygo"
          rm -rf "$HOME/Library/Saved Application State/com.syllune.PolygoMac.savedState"
          defaults delete com.syllune.PolygoMac >/dev/null 2>&1 || true
          xcodebuild \
            -project Polygo.xcodeproj \
            -scheme PolygoMacApp \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/PolygoMacDerivedData" \
            -destination-timeout 120 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath "$RUNNER_TEMP/PolygoMacUITests.xcresult" \
            test

      - name: Export macOS UI screenshots
        if: ${{ always() }}
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/PolygoMacUITests.xcresult"
          export_dir="$RUNNER_TEMP/PolygoMacScreenshots"
          mkdir -p "$export_dir"
          if [ -d "$result_bundle" ]; then
            if ! xcrun xcresulttool export attachments \
              --path "$result_bundle" \
              --output-path "$export_dir"; then
              echo "::warning::xcresulttool n’a pas exporté les pièces jointes; le bundle reste disponible"
            fi
          fi

      - name: Upload macOS UI test result and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PolygoMacUITests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/PolygoMacUITests.xcresult
            ${{ runner.temp }}/PolygoMacScreenshots
          if-no-files-found: warn
